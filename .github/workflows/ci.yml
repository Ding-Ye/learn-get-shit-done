name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  go:
    name: Go vet / build / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test
        run: go test ./...

  docs-parity:
    name: Bilingual heading parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify en/zh chapter docs have matching ## heading counts
        run: |
          set -euo pipefail
          fail=0
          for en in docs/en/*.md; do
            base=$(basename "$en")
            zh="docs/zh/$base"
            if [[ ! -f "$zh" ]]; then
              echo "::error file=$en::missing Chinese mirror $zh"
              fail=1
              continue
            fi
            en_count=$(grep -c '^## ' "$en" || true)
            zh_count=$(grep -c '^## ' "$zh" || true)
            if [[ "$en_count" -ne "$zh_count" ]]; then
              echo "::error::heading count mismatch: $en has $en_count, $zh has $zh_count"
              fail=1
            fi
          done
          exit "$fail"
